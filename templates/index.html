<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>TCL Remote Pro</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <h1>TCL Smart Remote</h1>

    <div class="input-container">
      <button onclick="send(84)" class="icon-button">🔍</button>
      <input type="text" id="tv_input" placeholder="英数字で検索..." />
      <button class="btn-send" onclick="sendText()">送信</button>
    </div>

    <div class="grid">
      <button class="btn-power" onclick="send(26)">POWER</button>
      <button class="btn-input" onclick="send(178)">INPUT</button>
      <button onclick="send(164)">MUTE</button>

      <div class="spacer"></div>
      <button onclick="send(19)">UP</button>
      <div class="spacer"></div>

      <button onclick="send(21)">LEFT</button>
      <button onclick="send(23)">OK</button>
      <button onclick="send(22)">RIGHT</button>

      <div class="spacer"></div>
      <button onclick="send(20)">DOWN</button>
      <div class="spacer"></div>

      <button onclick="send(4)">BACK</button>
      <button class="btn-home" onclick="send(3)">HOME</button>
      <button onclick="send(82)">MENU</button>

      <button class="btn-vol" onclick="send(24)">VOL +</button>
      <button class="btn-media" onclick="send(85)">PAUSE</button>
      <button class="btn-vol" onclick="send(25)">VOL -</button>

      <button class="btn-media" onclick="send(88)">PREV</button>
      <button class="btn-media" onclick="send(90)">FF</button>
      <button class="btn-media" onclick="send(87)">NEXT</button>

      <div class="label">Applications</div>
      <button class="span-3 btn-youtube" onclick="launch('youtube')">
        YouTube
      </button>
      <button class="span-3 btn-prime" onclick="launch('prime_video')">
        Prime Video
      </button>
      <button class="span-3 btn-tver" onclick="launch('tver')">TVer</button>
      <div class="label">Kids Safe Zone</div>
      <div class="grid-3col">
        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #4caf50, #2e7d32) !important;
          "
          onclick="jumpTo('numberblocks')"
        >
          🔢 数
        </button>
        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #2196f3, #1565c0) !important;
          "
          onclick="jumpTo('zooming')"
        >
          🔍 発声
        </button>
        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #ff9800, #ef6c00) !important;
          "
          onclick="jumpTo('miwu')"
        >
          🧪 科学
        </button>

        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #f44336, #c62828) !important;
          "
          onclick="jumpTo('denjiro')"
        >
          💥 実験
        </button>
        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #8bc34a, #558b2f) !important;
          "
          onclick="jumpTo('animal')"
        >
          🦁 動物
        </button>
        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #3f51b5, #283593) !important;
          "
          onclick="jumpTo('jaxa')"
        >
          🚀 宇宙
        </button>

        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #607d8b, #455a64) !important;
          "
          onclick="jumpTo('factory')"
        >
          🏗️ 社会
        </button>
        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #ff4081, #c2185b) !important;
          "
          onclick="jumpTo('music')"
        >
          🎵 歌・音
        </button>
        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #795548, #4e342e) !important;
          "
          onclick="jumpTo('art')"
        >
          🎨 工作
        </button>

        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #00bcd4, #00838f) !important;
          "
          onclick="jumpTo('language')"
        >
          🗣️ 発声
        </button>
        <button
          class="btn-edu"
          style="
            background: linear-gradient(135deg, #9c27b0, #6a1b9a) !important;
          "
          onclick="jumpTo('story')"
        >
          📚 物語
        </button>
      </div>

      <div class="grid-3col" style="margin-top: 8px">
        <button class="btn-utility" onclick="jumpTo('subs')">⭐ 登録済</button>
        <button class="btn-utility" onclick="jumpTo('later')">⏳ 後で見</button>
        <button class="btn-utility" onclick="send(3)">🏠 HOME</button>
      </div>

      <div class="label">YouTube Cleaner</div>
      <button class="span-3 btn-clean-shorts" onclick="cleanShorts()">
        🔥 ショート動画を掃除
      </button>
      <div class="label">Channel Cleaner</div>
      <div class="grid-3col">
        <button class="btn-clean-channels" onclick="cleanChannels(1)">
          🚫 1
        </button>
        <button class="btn-clean-channels" onclick="cleanChannels(2)">
          🚫 2
        </button>
        <button class="btn-clean-channels" onclick="cleanChannels(3)">
          🚫 3
        </button>
        <button class="btn-clean-channels" onclick="cleanChannels(5)">
          🚫 5
        </button>
        <button class="btn-clean-channels" onclick="cleanChannels(7)">
          🚫 7
        </button>
      </div>
      <div class="label" style="margin-top: 20px">History Cleaner</div>
      <div class="grid-3col">
        <button class="btn-clean-history" onclick="deleteHistory(1)">
          🚫 1
        </button>
        <button class="btn-clean-history" onclick="deleteHistory(2)">
          🚫 2
        </button>
        <button class="btn-clean-history" onclick="deleteHistory(3)">
          🚫 3
        </button>
        <button class="btn-clean-history" onclick="deleteHistory(5)">
          🚫 5
        </button>
        <button class="btn-clean-history" onclick="deleteHistory(7)">
          🚫 7
        </button>
      </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
